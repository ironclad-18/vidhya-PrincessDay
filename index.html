<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8dce8">
  <title>A little world for Vidhya ♡</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="gate-page">
  <div class="petal-layer" aria-hidden="true"></div>
  <main class="gate-wrap">
    <div class="gate-card">
      <div class="tiny-crown">♕</div>
      <p class="eyebrow">A little secret, made with love</p>
      <h1>For my Princess<br><span>Vidhya</span></h1>
      <div class="bouquet-mark" aria-hidden="true">🌷💐🌷</div>
      <p class="gate-copy">Before you enter our little fairytale,<br>tell me the date our story became official.</p>
      <form id="date-form" class="date-form">
        <label for="anniversary">Our anniversary</label>
        <input id="anniversary" name="anniversary" type="text" inputmode="numeric"
               placeholder="DD / MM / YYYY" autocomplete="off" maxlength="10" required>
        <button class="button button-primary" type="submit">Unlock my little world <span>♡</span></button>
        <p id="gate-error" class="error" role="alert" aria-live="polite"></p>
      </form>
      <p class="gate-hint">A date only we know · 06 / 08 / 2026</p>
      <div class="corner-flower flower-one">✿</div>
      <div class="corner-flower flower-two">❀</div>
    </div>
    <p class="footer-note">Made with all my love, Ashu ♡</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
